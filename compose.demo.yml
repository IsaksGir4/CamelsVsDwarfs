name: camelsvsdwarfs-demo

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: camelsvsdwarfs-app:latest
    container_name: camelsvsdwarfs-app-demo
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/camelsvsdwarfs/protocol/openid-connect/certs
      - KEYCLOAK_ISSUER_URI=http://localhost:${KEYCLOAK_PORT:-8180}/realms/camelsvsdwarfs
    networks:
      - camelsvsdwarfs-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: camelsvsdwarfs-keycloak-demo
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://localhost:${KEYCLOAK_PORT:-8180}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./backend/keycloak:/opt/keycloak/data/import:ro
    networks:
      - camelsvsdwarfs-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  camelsvsdwarfs-network:
    driver: bridge